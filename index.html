<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>森林疾驰 · Grove Sprint</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="stage">
    <canvas id="game" width="1280" height="720"></canvas>

    <div id="menu" class="overlay">
      <div class="panel">
        <h1 class="title">森林疾驰</h1>
        <p class="subtitle">无尽跑酷 · Grove Sprint</p>
        <p class="keys">← → 移动 &nbsp;·&nbsp; 空格 / ↑ 跳跃 &nbsp;·&nbsp; X / J 挥砍</p>
        <p class="bestline" id="menu-best">最高分 0</p>
        <button id="btn-start" class="btn">开始游戏</button>
      </div>
    </div>

    <div id="gameover" class="overlay hidden">
      <div class="panel">
        <h2 class="title small">旅程结束</h2>
        <p class="stat">本次得分 <b id="go-score">0</b></p>
        <p class="stat">奔跑距离 <b id="go-dist">0</b> m · 击败 <b id="go-kills">0</b></p>
        <p class="bestline" id="go-best">最高分 0</p>
        <button id="btn-again" class="btn">再来一次</button>
      </div>
    </div>

    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="js/assets.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
